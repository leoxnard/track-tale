name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # An advisory against something in the request path of a public page is
      # worth a red build; anything below high is noise on a project this size.
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      # Catch a broken build here rather than on the deploy that follows it.
      - run: npm run build
